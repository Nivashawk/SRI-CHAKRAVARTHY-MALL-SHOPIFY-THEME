openapi: 3.1.0

# Machine-readable contract for the API the Odoo team implements.
# Prose, rationale and the security requirements live in
# ../odoo-customer-identity-integration.md — read that first; this file
# is the precise shape of each call, not the reasoning behind it.
#
# Status: proposal. Paths, field names and codes are ours to agree on
# together; push back on anything that fights Odoo's grain.

info:
  title: Odoo Customer Identity API
  version: 1.0.0-draft
  summary: Phone-first customer identity for Sri Chakravarthy Mall, shared by the Odoo apps and the Shopify storefront.
  description: |
    Odoo is the identity provider. A customer signs in once with a phone
    number (or email) and a one-time code, and is then signed in across
    Odoo POS, rewards, invoicing, virtual try-on and the Shopify
    storefront account area.

    The only client of this API is `mall-backend`, the Shopify-side
    service at https://mall-app.brite.app. Browsers never call it
    directly.

    Two authentication layers are in play and must not be confused:

      * `serviceAuth` — proves the *caller* is mall-backend.
        Required on every endpoint.
      * `customerAuth` — the customer's own access token, forwarded by
        mall-backend on `/partners/me*` and `/invoices`. The partner is
        resolved from this token and never from a parameter.
  contact:
    name: Shopify team
  x-blockers:
    - Phone numbers must be unique on res.partner before go-live.
    - Shopify sends no SMS notifications in India, so /notifications/order
      is the only way a phone-only customer learns their order was placed.

servers:
  - url: https://{odooHost}/api/v1
    description: Odoo identity service
    variables:
      odooHost:
        default: odoo-test.example.com
        description: Test host first; production host supplied privately.

tags:
  - name: auth
    description: One-time code sign-in, tokens and revocation.
  - name: partner
    description: The customer's own profile, addresses and invoices.
  - name: notifications
    description: Outbound messaging to the customer, triggered by Shopify order events.
  - name: system
    description: Keys and health.

security:
  - serviceAuth: []

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a one-time code
      description: |
        Sends a 6-digit code to a phone number by SMS, or to an email
        address by email.

        **The response must be identical, in body and in timing, whether
        or not the identifier belongs to an existing partner.** Anything
        else lets an attacker discover who shops here. Never return
        "no account found".

        Rate limits, the country allowlist and the daily spend ceiling
        are specified in §4.3 of the companion document and are required,
        not optional: this endpoint spends the client's money on every
        call.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ForwardedFor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  maxLength: 254
                  description: E.164 phone (`+919876543210`) or an email address. We normalise phones before sending.
                  examples: ['+919876543210', 'customer@example.com']
                channel:
                  type: string
                  enum: [sms, whatsapp, email, auto]
                  default: auto
                  description: '`auto` lets Odoo choose: WhatsApp with SMS fallback for phones, email for addresses.'
                locale:
                  $ref: '#/components/schemas/Locale'
                device_id:
                  type: string
                  description: Opaque per-browser id, for your per-device limits.
                  maxLength: 64
      responses:
        '200':
          description: Code sent, or silently not sent for an unknown identifier. The caller cannot tell the difference, by design.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, resend_after, expires_in]
                properties:
                  request_id:
                    type: string
                    description: Opaque handle for the verify step. Must not encode the phone number.
                  resend_after:
                    type: integer
                    description: Seconds before another code may be requested (30, then 60, then 300).
                  expires_in:
                    type: integer
                    description: Code lifetime in seconds. Expected 300.
                  code_length:
                    type: integer
                    default: 6
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SenderUnavailable' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify the code and issue tokens
      description: |
        Compares the code in constant time, marks it used, and returns
        the customer's tokens and profile.

        Five failed attempts kill the code and lock the identifier for
        15 minutes. A code is single-use: a replay must fail even within
        its lifetime.

        If the identifier matches more than one partner, return
        `partner_ambiguous` rather than guessing — we block the login,
        because showing one customer another's orders is the worst
        failure this system can have.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ForwardedFor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, code]
              properties:
                request_id: { type: string }
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                device_id: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, expires_in, partner]
                properties:
                  access_token:
                    type: string
                    description: RS256 JWT. Claims in §4.2 of the companion document.
                  refresh_token:
                    type: string
                    description: Opaque, >=32 random bytes, stored hashed, rotated on every use.
                  expires_in: { type: integer, description: Access token lifetime in seconds. Expected 900. }
                  token_type: { type: string, enum: [Bearer], default: Bearer }
                  partner: { $ref: '#/components/schemas/Partner' }
                  is_new_partner:
                    type: boolean
                    description: True when this OTP created the partner. We use it to ask for a name and optional email.
        '400':
          description: Wrong, expired or already-used code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { error: { code: otp_invalid, message: 'That code is not right.', attempts_left: 3 } }
                expired:
                  value: { error: { code: otp_expired, message: 'That code has expired. Please request a new one.' } }
        '409':
          description: More than one partner shares this identifier. De-duplicate in Odoo; we cannot resolve it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: partner_ambiguous, message: 'Please contact the store.' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the refresh token
      description: |
        Returns a new access token **and a new refresh token**; the old
        refresh token dies immediately.

        If a refresh token is presented a second time, treat it as theft:
        revoke every session in that family and return `401`. The customer
        signs in again with a fresh code. This is what limits the damage
        when a token is stolen from a browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, expires_in]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer }
        '401':
          description: Expired, unknown, or replayed. On replay, the whole session family is now revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke one session or all of them
      description: |
        `scope: session` ends this browser's session. `scope: all`
        increments the partner's `tv` claim, which must end every session
        in every Odoo app as well — this is the "sign me out everywhere"
        control, and the one used if a customer loses their phone.
      security:
        - serviceAuth: []
          customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [session, all], default: session }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /partners/me:
    get:
      tags: [partner]
      operationId: getPartner
      summary: The signed-in customer's profile
      description: The partner is resolved from the customer's token. A partner id in a parameter must never be accepted here.
      security:
        - serviceAuth: []
          customerAuth: []
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [partner]
      operationId: updatePartner
      summary: Update name, email, birthday or consents
      description: |
        Changing an email needs a fresh one-time code: if `auth_time` in
        the customer's token is more than 10 minutes old, return
        `step_up_required` and we will ask the customer to verify again.

        A duplicate email must return `validation_failed`, not a 500 — we
        show the customer a clean message.
      security:
        - serviceAuth: []
          customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 60 }
                last_name: { type: string, maxLength: 60 }
                email: { type: string, format: email }
                birthday: { $ref: '#/components/schemas/Birthday' }
                locale: { $ref: '#/components/schemas/Locale' }
                marketing_consent:
                  type: object
                  description: Marketing only. One-time codes and order updates are service messages and are always sent.
                  properties:
                    whatsapp: { type: boolean }
                    sms: { type: boolean }
                    email: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partner' }
        '403':
          description: Needs a fresh code first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: step_up_required, message: 'Please verify your phone number again.' } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /partners/me/addresses:
    get:
      tags: [partner]
      operationId: listAddresses
      summary: The customer's address book
      security:
        - serviceAuth: []
          customerAuth: []
      responses:
        '200':
          description: Up to 5 addresses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [partner]
      operationId: createAddress
      summary: Add an address
      description: Reject a sixth address with `validation_failed`. We enforce the same cap in the UI.
      security:
        - serviceAuth: []
          customerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /partners/me/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [partner]
      operationId: updateAddress
      summary: Edit an address
      description: The address must belong to the partner in the token. If it does not, return 404 — never 403, which would confirm the address exists.
      security:
        - serviceAuth: []
          customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [partner]
      operationId: deleteAddress
      summary: Remove an address
      security:
        - serviceAuth: []
          customerAuth: []
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /partners/me/invoices:
    get:
      tags: [partner]
      operationId: listInvoices
      summary: Invoices for the signed-in customer
      description: |
        `pdf_url` must be a **time-limited signed link** (15 minutes is
        plenty). A permanent or guessable link is a document leak, and we
        will not proxy PDFs through our server to compensate.
      security:
        - serviceAuth: []
          customerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  next_cursor: { type: string, nullable: true }

  /notifications/order:
    post:
      tags: [notifications]
      operationId: notifyOrder
      summary: Message the customer about an order
      description: |
        **This endpoint replaces Shopify's order emails.** Shopify sends
        no SMS in India, and a phone-only customer has no email address,
        so without this the customer hears nothing after paying.

        We call it on every order event. You choose the channel — WhatsApp
        preferred, SMS as fallback — using the client's DLT-registered
        templates.

        Must be idempotent on `Idempotency-Key`: we retry failures with
        backoff, and a customer must never receive the same message twice.
        Queue the message and return 202; do not hold the connection open
        while the provider responds.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderNotification' }
      responses:
        '202': { description: Queued. }
        '404':
          description: Unknown partner. We log it and alert; no retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /partners/{partnerId}/external-ids:
    post:
      tags: [partner]
      operationId: linkExternalId
      summary: Record the Shopify customer id we linked to this partner
      description: |
        Informational, for your reporting. One partner may accumulate
        several Shopify customer ids, because a guest checkout with a new
        email creates a new Shopify customer. We keep the authoritative
        mapping; storing them your side just makes support conversations
        easier. Treat a repeat of the same id as a no-op.
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system, id]
              properties:
                system: { type: string, enum: [shopify] }
                id:
                  type: string
                  examples: ['gid://shopify/Customer/7284619283']
                is_primary: { type: boolean, default: true }
      responses:
        '204': { description: Recorded. }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness
      description: Cheap and dependency-free. We poll it to close our circuit breaker after an outage, so it must not touch the database.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }

components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Proves the caller is mall-backend. OAuth 2.0 client credentials
        preferred; a rotatable static key in `X-Api-Key` is acceptable.
        Pair it with an IP allowlist — our server's address is fixed and
        will be shared privately.
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The customer's own access token, forwarded by mall-backend in
        `X-Customer-Authorization`. The partner is resolved from this
        token alone.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
      description: Replaying a key within 24 hours must return the original result without repeating the action.
    ForwardedFor:
      name: X-Forwarded-For
      in: header
      required: false
      schema: { type: string }
      description: The customer's IP, for your per-IP rate limits.

  schemas:
    Locale:
      type: string
      enum: [en, ta]
      default: en
      description: Tamil is a real audience for this store, not a nicety. Template both.

    Birthday:
      type: string
      description: |
        `--MM-DD` (day and month only) is recommended. A full date lets
        you identify minors, which brings a parental-consent obligation
        under the DPDP Act. Birthday offers do not need the year.
      examples: ['--11-23', '1987-11-23']

    Partner:
      type: object
      required: [partner_id, phone]
      properties:
        partner_id: { type: integer }
        phone:
          type: string
          description: E.164. The login identity, and unique across partners.
          examples: ['+919876543210']
        phone_verified_at: { type: string, format: date-time }
        email: { type: string, format: email, nullable: true }
        email_verified: { type: boolean, default: false }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        birthday: { $ref: '#/components/schemas/Birthday' }
        locale: { $ref: '#/components/schemas/Locale' }
        marketing_consent:
          type: object
          properties:
            whatsapp: { type: boolean }
            sms: { type: boolean }
            email: { type: boolean }
            updated_at: { type: string, format: date-time }
        rewards:
          type: object
          nullable: true
          description: Shown in the storefront account area if you expose it.
          properties:
            balance: { type: integer }
            tier: { type: string, nullable: true }
            expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AddressInput:
      type: object
      required: [name, phone, address1, city, state, pincode]
      properties:
        name: { type: string, maxLength: 120 }
        phone:
          type: string
          description: E.164. May differ from the login phone — gift deliveries are common.
        address1: { type: string, maxLength: 200 }
        address2: { type: string, maxLength: 200, nullable: true }
        landmark: { type: string, maxLength: 120, nullable: true }
        city: { type: string, maxLength: 80 }
        state:
          type: string
          description: Indian state or union territory, spelled as in Shopify's list, so checkout accepts it unchanged.
        pincode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
        country_code: { type: string, default: IN, pattern: '^[A-Z]{2}$' }
        is_default: { type: boolean, default: false }

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            updated_at: { type: string, format: date-time }

    Invoice:
      type: object
      required: [id, number, date, total, currency]
      properties:
        id: { type: string }
        number: { type: string, examples: ['INV/2026/0412'] }
        date: { type: string, format: date }
        total: { $ref: '#/components/schemas/Money' }
        currency: { type: string, default: INR }
        status: { type: string, enum: [paid, due, cancelled] }
        shopify_order_number: { type: string, nullable: true, examples: ['#1043'] }
        pdf_url:
          type: string
          format: uri
          description: Signed and short-lived. Never a permanent link.
        pdf_url_expires_at: { type: string, format: date-time }

    Money:
      type: string
      description: Decimal string, two places. Never a float — rounding errors in money are unforgivable and hard to trace.
      pattern: '^[0-9]+\.[0-9]{2}$'
      examples: ['12450.00']

    OrderNotification:
      type: object
      required: [event, occurred_at, partner_id, order]
      properties:
        event:
          type: string
          enum:
            - order.placed
            - order.paid
            - order.shipped
            - order.out_for_delivery
            - order.delivered
            - order.cancelled
            - order.refunded
            - return.requested
            - return.approved
            - cart.abandoned
        occurred_at: { type: string, format: date-time }
        partner_id: { type: integer }
        phone: { type: string }
        email: { type: string, nullable: true }
        locale: { $ref: '#/components/schemas/Locale' }
        order:
          type: object
          required: [number, currency, total]
          properties:
            number: { type: string, examples: ['#1043'] }
            placed_at: { type: string, format: date-time }
            currency: { type: string }
            total: { $ref: '#/components/schemas/Money' }
            item_count: { type: integer }
            items:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  quantity: { type: integer }
                  price: { $ref: '#/components/schemas/Money' }
                  image_url: { type: string, format: uri, nullable: true }
            status_url:
              type: string
              format: uri
              description: The order page in our account area. Safe to put in a message; it requires sign-in.
            tracking:
              type: object
              nullable: true
              properties:
                carrier: { type: string, examples: ['ST Courier'] }
                number: { type: string }
                url: { type: string, format: uri }
            cancel_reason: { type: string, nullable: true }
            refund_amount: { $ref: '#/components/schemas/Money' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_identifier
                - rate_limited
                - otp_invalid
                - otp_expired
                - otp_locked
                - sender_unavailable
                - partner_not_found
                - partner_ambiguous
                - validation_failed
                - step_up_required
                - internal_error
            message:
              type: string
              description: Safe to show a customer. No internal detail, no stack traces, no partner ids.
            retry_after: { type: integer, nullable: true }
            attempts_left: { type: integer, nullable: true }
            fields:
              type: object
              nullable: true
              description: Field name to problem, for validation_failed.
              additionalProperties: { type: string }

  responses:
    BadRequest:
      description: Malformed request or an identifier we cannot parse.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, expired or invalid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record for this customer. Used instead of 403 so the response never confirms that someone else's record exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts. Always include `retry_after`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request parsed but the values are not acceptable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SenderUnavailable:
      description: The SMS or WhatsApp provider failed. Do not leak provider detail to the customer.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
