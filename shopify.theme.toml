# Shopify CLI environments.
# Lets you run `shopify theme dev -e dev` instead of passing --store every time.
# Docs: https://shopify.dev/docs/storefronts/themes/tools/cli/environments

# Admin: https://admin.shopify.com/store/sri-chakravarty-mall
[environments.dev]
store = "sri-chakravarty-mall"
# "Sri Chakravarthy Mall (dev)" — the name says dev, but this theme is now
# PUBLISHED and is the live storefront (`shopify theme list` confirms [live]).
# Every push to -e dev therefore needs --allow-live and lands on the real shop.
theme = "165494358264"
