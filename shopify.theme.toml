# Shopify CLI environments.
# Docs: https://shopify.dev/docs/storefronts/themes/tools/cli/environments
#
# Admin:      https://admin.shopify.com/store/4qzxbq-rf
# Storefront: https://chakravathy.myshopify.com
#
# TWO NAMES, ONE STORE. `4qzxbq-rf` is the canonical handle the API and CLI
# require; `chakravathy` is only the customer-facing storefront domain
# and is REJECTED with a 401 by the CLI. Always use 4qzxbq-rf here.
#
# The previous store, sri-chakravarty-mall (note: no "h"), was a development
# store created "for testing" and could never be transferred to the client, which
# is why this theme was migrated rather than handed over. It still hosts the
# product images referenced by scripts/sarees-client-import.csv, so do not delete
# it until the catalogue import is finished.

# DEFAULT TARGET — and, since 2026-09-16, THE LIVE STOREFRONT.
#
# WARNING: 190107844893 is PUBLISHED. It serves https://srichakravarthymall.com
# to real customers. It was unpublished when this file was first written; it was
# published from the admin between sessions. Consequences:
#
#   * every `shopify theme push -e dev` is immediately customer-visible
#   * pushing now REQUIRES --allow-live
#   * README.md's safety check ("push must succeed WITHOUT --allow-live, or dev
#     is pointing at the live theme") no longer holds — it now fails by design,
#     because dev IS the live theme
#
# Preview with `shopify theme dev -e dev`, which touches nothing on the store.
[environments.dev]
store = "4qzxbq-rf"
theme = "190107844893"  # "Sri Chakravarthy Mall" — LIVE

# ROLLBACK TARGET.
#
# Stock Horizon (#190107484445) is now the *unpublished* theme — the roles
# swapped when the mall theme went live. Republish it from the admin if the live
# theme ever has to be pulled down in a hurry.
#
# `production` is deliberately left unset: `dev` already points at the live
# theme, and a second alias for the same id would only invite a double push.
