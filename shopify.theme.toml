# Shopify CLI environments.
# Docs: https://shopify.dev/docs/storefronts/themes/tools/cli/environments
#
# Admin:      https://admin.shopify.com/store/x05pzd-dc
# Storefront: https://sri-chakravarthy-mall.myshopify.com
#
# TWO NAMES, ONE STORE. `x05pzd-dc` is the canonical handle the API and CLI
# require; `sri-chakravarthy-mall` is only the customer-facing storefront domain
# and is REJECTED with a 401 by the CLI. Always use x05pzd-dc here.
#
# The previous store, sri-chakravarty-mall (note: no "h"), was a development
# store created "for testing" and could never be transferred to the client, which
# is why this theme was migrated rather than handed over. It still hosts the
# product images referenced by scripts/sarees-client-import.csv, so do not delete
# it until the catalogue import is finished.

# DEFAULT TARGET — the working theme. Not published, so previewing or pushing by
# habit cannot change what shoppers see.
[environments.dev]
store = "x05pzd-dc"
theme = "152195367087"  # "Sri Chakravarthy Mall" — unpublished

# THE LIVE STOREFRONT.
#
# Deliberately unset. The live theme on this store is still stock Horizon
# (#152194777263) — pushing this repo over it would replace Shopify's default
# with a half-configured storefront while the client's own migration is still in
# progress. Once "Sri Chakravarthy Mall" (152195367087) is published, set that id
# here.
#
#   shopify theme push -e production --allow-live
#
# [environments.production]
# store = "x05pzd-dc"
# theme = "<id of the published theme>"
